# Available options: https://codeberg.org/dnkl/foot/src/branch/master/foot.ini
# Manual: https://man.archlinux.org/man/foot.ini.5.en

[main]
	font=Lilex:size=11
	line-height=18

	initial-window-size-chars=90x26
	pad=10x0

	title=""
	locked-title=yes

[cursor]
	style=beam
	beam-thickness=1.15
	blink=yes
	blink-rate=600

[csd]
	color=100F0F
	button-color=CECDC3

	border-width=1
	border-color=2C2B2A

# Flexoki Dark theme
[colors-dark]
	cursor=100F0F 3AA99F

	foreground=CECDC3
	background=100F0F

	regular0=403E3C
	regular1=D14D41
	regular2=879A39
	regular3=D0A215
	regular4=4385BE
	regular5=CE5D97
	regular6=3AA99F
	regular7=9F9D96

	bright0=6F6E69
	bright1=D14D41
	bright2=879A39
	bright3=D0A215
	bright4=4385BE
	bright5=CE5D97
	bright6=3AA99F
	bright7=CECDC3

	selection-foreground=100F0F
	selection-background=403E3C

	search-box-no-match=100F0F D14D41
	search-box-match=CECDC3 282726

	scrollback-indicator=1C1B1A 4385BE
	jump-labels=1C1B1A DA702C
	flash=DA702C
	urls=3AA99F
