# Available options: https://codeberg.org/dnkl/foot/src/branch/master/foot.ini
# Manual: https://man.archlinux.org/man/foot.ini.5.en

[main]
	font=BlexMono Nerd Font:size=10

[cursor]
	style=beam
	beam-thickness=1
	blink=yes
	blink-rate=600

[csd]
	color=100F0F
	button-color=CECDC3

	border-width=1
	border-color=2C2B2A

# Flexoki Dark theme
[colors-dark]
	cursor=100F0F CECDC3

	foreground=CECDC3
	background=100F0F

	regular0=282726 # Black
	regular1=D14D41 # Red
	regular2=879A39 # Green
	regular3=D0A215 # Yellow
	regular4=4385BE # Blue
	regular5=CE5D97 # Magenta
	regular6=3AA99F # Cyan
	regular7=878580 # White

	bright0=403E3C # Bright black
	bright1=D14D41 # Bright red
	bright2=879A39 # Bright green
	bright3=D0A215 # Bright yellow
	bright4=4385BE # Bright blue
	bright5=CE5D97 # Bright magenta
	bright6=3AA99F # Bright cyan
	bright7=CECDC3 # Bright white

	selection-foreground=100F0F
	selection-background=403E3C

	search-box-no-match=100F0F D14D41
	search-box-match=CECDC3 282726

	scrollback-indicator=1C1B1A 4385BE
	jump-labels=1C1B1A DA702C
	flash=DA702C
	urls=3AA99F
